<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBHomePage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>A new adventure awaits!</header>
    <input type="text" id="name" name="name" placeholder="Enter your character name">
    <div class="selection">
        <div class="classContainer">
            <p>Choose your starting class</p>
            <div class="warriorClass">
                <p>The Knight</p>
                <button class="classSelection" id="warrior">Warrior</button>
            </div>
            <div class="archerClass">
                <p>The Rogue</p>
                <button class="classSelection" id="rogue">Rogue</button>
            </div>
            <div class="mageClass">
                <p>The Mage</p>
                <button class="classSelection" id="mage">Mage</button>
            </div>
            <div class="paladinClass">
                <p>The Paladin</p>
                <button class="classSelection" id="paladin">Paladin</button>
            </div>
        </div>
        <div class="characterPreview">
            <p><u>Character preview</u></p>
            <p>Class: </p>
            <p>Race: </p>
            <div class="equipmentBlock">
                <p>Weapon: </p>
                <p>Armor: </p>
            </div>
            <div class="attributes">
                <div class="statBlock">
                    <p>Stats</p>
                    <br>
                    <p>Level: </p>
                    <br>
                    <p>Strength: </p>
                    <p>Agility: </p>
                    <p>Intelligence: </p>
                    <p>Endurance: </p>
                    <p>Arcane: </p>
                    <p>Faith: </p>
                    <p>Race resistance: </p>
                </div>
            </div>
        </div>
        <div class="raceContainer">
            <p>Choose your race</p>
            <div class="humanRace">
                <p>Human</p>
                <button class="raceSelection" id="human">Human</button>
            </div>
            <div class="dwarfRace">
                <p>Dwarf</p>
                <button class="raceSelection" id="dwarf">Dwarf</button>
            </div>
            <div class="elfRace">
                <p>Elf</p>
                <button class="raceSelection" id="elf">Elf</button>
            </div>
            <div class="orcRace">
                <p>Orc</p>
                <button class="raceSelection" id="orc">Orc</button>
            </div>
        </div>
    </div>
    <button id="createCharacter">Create character</button>

    <script src="script.js"></script>
</body>
</html>
